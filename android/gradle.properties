org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin incremental compilation fails on Windows when the project drive (E:) differs
# from the pub cache drive (C:) — KT-62packages. Disable it here.
kotlin.incremental=false

# Android builds: JDK 17 or 21 (LTS) is typical. Set JAVA_HOME, or pin Gradle's JVM, e.g.:
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-17
#
# This project uses Gradle 9.2.1 so it can run on JDK 25+ (JAVA_HOME). If you switch back to JDK 17
# only, Gradle 9.2.1 still works; you can also use Gradle 8.14 with JDK 17 if you prefer.
