name: glimpse
description: "Glimpse — smart local bookmarks with AI categorization and semantic search."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.7+7

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Glyphs used by AppTheme's Cupertino page transitions on Apple platforms.
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # HTTP
  dio: ^5.4.0

  # Link Preview
  any_link_preview: ^3.0.0

  # Navigation
  go_router: ^14.0.0

  # Utils
  firebase_core: ^4.9.0
  firebase_app_check: ^0.4.4+1
  html_unescape: ^2.0.0
  html: ^0.15.6
  url_launcher: ^6.2.0
  share_plus: ^10.0.0
  receive_sharing_intent: ^1.8.0
  file_picker: ^8.0.0

  # Dynamic Color (Material You)
  dynamic_color: ^1.7.0

  # AI — Gemini Flash
  # Shared Preferences for theme persistence
  shared_preferences: ^2.2.0
  package_info_plus: ^8.0.0
  in_app_update: ^4.2.5

  # Image caching (persists to disk so images are instant after first load)
  cached_network_image: ^3.3.1

  # Automatic Library — interactive place maps
  maplibre_gl: ^0.26.0

  # JSON Serialization
  path_provider: ^2.1.5
  purchases_flutter: ^9.13.1
  purchases_ui_flutter: ^9.13.1
  google_fonts: ^8.0.2

  # Ask screen: keyboard visibility + suggestion shimmer
  shimmer: ^3.0.0

  # SVG rendering
  flutter_svg: ^2.0.10+1

  # Collections — emoji picker
  # Weekly digest
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.9.0+3
  glimpse_backup_storage:
    path: packages/glimpse_backup_storage
  uuid: ^4.5.3
  flutter_native_splash: ^2.4.5
  supabase_flutter: ^2.15.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.2.0
  phosphor_flutter: ^2.1.0
  androidx_graphics_shapes: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.3

# ── App Icon ──────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/glimpse.png"
  min_sdk_android: 21

# ── Splash Screen ─────────────────────────────────────────────────────────────
# `assets/splash_icon.png` and `assets/splash_branding*.png` are regenerated
# by tools/generate_android_icons.py. The icon uses a 1152x1152 transparent
# canvas with the glimpse character at 64% (inside Android 12's circular safe
# zone, so nothing is clipped on any density).
flutter_native_splash:
  color: "#F5F4F0"
  color_dark: "#1C1B1F"
  image: "assets/splash_icon.png"
  branding: "assets/splash_branding.png"
  branding_dark: "assets/splash_branding_dark.png"
  branding_mode: bottom
  branding_bottom_padding: 40
  android_12:
    color: "#F5F4F0"
    color_dark: "#1C1B1F"
    image: "assets/splash_icon.png"
    branding: "assets/splash_branding.png"
    branding_dark: "assets/splash_branding_dark.png"
    # Intentionally NOT setting icon_background_color: when omitted, Android 12+
    # uses the larger 192dp/288dp (66.7%) safe zone instead of the tighter
    # 160dp/288dp (55%) one, leaving more margin so nothing is clipped. The
    # icon's own transparent background then shows the splash `color` through
    # it — visually identical since both are #F5F4F0 anyway.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/glimpse.png
    - assets/glimpse.svg
    - assets/home.png
    - assets/splash_icon.png
    - assets/splash_branding.png
    - assets/splash_branding_dark.png
    - assets/search.png
    - assets/mindmap.png
    - assets/empty_collection.png
    - assets/onboarding_kyoto.webp
    - android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
    - assets/brands/
    - assets/fonts/
    - assets/rediscover/illustrations/
    - assets/interests/top_signal_cutout.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
