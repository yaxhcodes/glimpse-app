name: glimpse_backup_storage
description: Background-capable Android SAF storage bridge for Glimpse backups.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.shinrinyoku.glimpse.backupstorage
        pluginClass: GlimpseBackupStoragePlugin
